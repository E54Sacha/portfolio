# Render Blueprint: the FastAPI back end (api/). The front end (web/) is on Vercel.
services:
  - type: web
    name: portfolio-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ALLOWED_ORIGINS
        value: https://portfolio-five-khaki-3lwpzpubw8.vercel.app,http://localhost:3000
      # Email: your Gmail over SMTP (set both in the Render dashboard)
      - key: SMTP_USER
        sync: false # your Gmail address
      - key: SMTP_PASSWORD
        sync: false # a Gmail app password, never your real password
      # Optional: CONTACT_TO (defaults to SMTP_USER), or RESEND_API_KEY + CONTACT_TO to use Resend instead
