# Render Blueprint: the FastAPI back end (api/). The front end (web/) is on Vercel.
services:
  - type: web
    name: portfolio-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ALLOWED_ORIGINS
        value: https://portfolio-five-khaki-3lwpzpubw8.vercel.app,http://localhost:3000
      # Email: Resend over HTTPS (the free plan blocks outgoing SMTP). Set both in the Render dashboard.
      - key: RESEND_API_KEY
        sync: false # from resend.com > API Keys
      - key: CONTACT_TO
        sync: false # the address you signed up to Resend with; messages arrive there
      # SMTP_USER + SMTP_PASSWORD (Gmail app password) also work, but only on a paid plan; Resend wins if both are set
